# =============================================================================
# Why log4j2 (and not logback)?
# Spark 3.5.x already bundles Log4j2 on its classpath. Adding a second
# logging framework (e.g. Logback) creates "multiple SLF4J bindings" conflicts
# that are a classic source of confusing demo failures. We reuse what Spark
# already brings and just point it at OUR pattern + OUR levels.
# =============================================================================

status = warn
name = PaymentStreamingDemoLogConfig

# Quiet down Spark's own internal chatter so OUR business logs stand out.
# This is exactly what an SRE does in real life: turn the noise floor down
# so signal (payment events, incidents) is visible.
logger.spark.name = org.apache.spark
logger.spark.level = WARN

logger.hadoop.name = org.apache.hadoop
logger.hadoop.level = WARN

logger.delta.name = io.delta
logger.delta.level = WARN

logger.kafka.name = org.apache.kafka
logger.kafka.level = WARN

# Our own application code: keep at INFO so every payment / incident log shows.
logger.bank.name = com.bank.retail
logger.bank.level = INFO

rootLogger.level = WARN
rootLogger.appenderRef.console.ref = ConsoleAppender

appender.console.type = Console
appender.console.name = ConsoleAppender
appender.console.layout.type = PatternLayout
# %X{correlationId} pulls the correlationId we push into Log4j2's ThreadContext
# (the structured-logging equivalent of MDC) - this is what lets an SRE grep
# ALL log lines for one specific failing transaction across the whole pipeline.
appender.console.layout.pattern = %d{HH:mm:ss.SSS} %-5level [%t] correlationId=%X{correlationId} %c{1} - %msg%n
