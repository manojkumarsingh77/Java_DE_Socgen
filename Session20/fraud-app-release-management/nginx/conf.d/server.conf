# Static server block. Do NOT edit the upstream here - it lives in
# upstream.conf and is regenerated by scripts/08-canary-rollout.sh.
server {
    listen 80;
    server_name _;

    location /health {
        proxy_pass http://fraud_backend/health;
        proxy_set_header Host $host;
    }

    location /version {
        proxy_pass http://fraud_backend/version;
        proxy_set_header Host $host;
    }

    location /score {
        proxy_pass http://fraud_backend/score;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://fraud_backend;
        proxy_set_header Host $host;
    }
}
