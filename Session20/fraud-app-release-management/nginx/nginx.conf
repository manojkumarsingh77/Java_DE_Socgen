worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;
    error_log     /dev/stderr;
    sendfile      on;

    # upstream.conf defines the fraud_backend upstream and is REWRITTEN by
    # scripts/08-canary-rollout.sh to shift traffic weights between the
    # blue and green slots. server.conf is static and just proxies to it.
    include /etc/nginx/conf.d/*.conf;
}
