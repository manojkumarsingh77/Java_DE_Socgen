# =============================================================================
# TOPIC: Secrets Management
# Prerequisite (one-time per AKS cluster):
#   az aks enable-addons --addons azure-keyvault-secrets-provider \
#     --resource-group <rg> --name <aks-cluster-name>
# This installs the CSI Secrets Store driver + Azure provider daemonset.
# =============================================================================

# 1) SecretProviderClass - declares WHICH Key Vault secrets to mount and
#    HOW to authenticate (Workload Identity Federation - no stored password).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: banking-dev-adls-secrets
  namespace: banking-dev
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "<AZURE_WORKLOAD_IDENTITY_CLIENT_ID>"   # replace with your UAMI client ID
    keyvaultName: "<YOUR_KEYVAULT_NAME>"                # replace with your Key Vault name
    tenantId: "<YOUR_AZURE_TENANT_ID>"                  # replace with your tenant ID
    objects: |
      array:
        - |
          objectName: dev-adls-storage-key
          objectType: secret
        - |
          objectName: dev-servicebus-connection-string
          objectType: secret
  # Optionally sync into a native Kubernetes Secret so it can ALSO be
  # consumed via envFrom.secretRef (Tier 2 of SecretsResolver.java)
  secretObjects:
    - secretName: banking-dev-adls-k8s-secret
      type: Opaque
      data:
        - objectName: dev-adls-storage-key
          key: DEV_ADLS_STORAGE_KEY
---
# 2) Service Account annotated for Azure Workload Identity Federation - the
#    Spark driver/executor pods run under this identity, which has been
#    granted "Storage Blob Data Contributor" on the ADLS storage account
#    (least-privilege, no shared account keys required if using this path).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark-workload-identity-sa
  namespace: banking-dev
  annotations:
    azure.workload.identity/client-id: "<AZURE_WORKLOAD_IDENTITY_CLIENT_ID>"
  labels:
    azure.workload.identity/use: "true"
---
# 3) Example Pod spec fragment showing HOW the SecretProviderClass mounts
#    (referenced by k8s/06-sparkapplication-dev.yaml's driver/executor spec
#    via `volumes` + `volumeMounts` - shown standalone here for clarity)
apiVersion: v1
kind: Pod
metadata:
  name: secret-mount-reference-example
  namespace: banking-dev
  labels:
    azure.workload.identity/use: "true"
spec:
  serviceAccountName: spark-workload-identity-sa
  containers:
    - name: reference-only
      image: mcr.microsoft.com/azure-cli
      command: ["sleep", "3600"]
      volumeMounts:
        - name: secrets-store-inline
          mountPath: "/mnt/secrets-store"
          readOnly: true
  volumes:
    - name: secrets-store-inline
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: "banking-dev-adls-secrets"
