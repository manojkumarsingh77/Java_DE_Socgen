apiVersion: v1
kind: Pod
metadata:
  labels:
    role: spark-driver
    workload: fraud-aggregation
spec:
  # Pin the driver to the AKS system node pool so user-facing workloads
  # never compete with the driver's control-plane connection to the K8s API server.
  nodeSelector:
    kubernetes.azure.com/mode: system
  containers:
    - name: spark-kubernetes-driver
      resources:
        requests:
          cpu: "1"
          memory: "2Gi"
        limits:
          cpu: "2"
          memory: "2560Mi"   # memory limit = spark.driver.memory + memoryOverhead
