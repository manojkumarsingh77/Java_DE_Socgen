apiVersion: v1
kind: Pod
metadata:
  labels:
    role: spark-executor
    workload: fraud-aggregation
spec:
  # Executors scheduled onto a spot/low-priority user node pool for cost efficiency —
  # safe because dynamicAllocation + shuffleTracking (configured in code) allow
  # graceful executor eviction without job failure.
  nodeSelector:
    kubernetes.azure.com/mode: user
    kubernetes.azure.com/scalesetpriority: spot
  tolerations:
    - key: "kubernetes.azure.com/scalesetpriority"
      operator: "Equal"
      value: "spot"
      effect: "NoSchedule"
  containers:
    - name: spark-kubernetes-executor
      resources:
        requests:
          cpu: "2"
          memory: "4Gi"
        limits:
          cpu: "2"
          memory: "5Gi"      # memory limit = spark.executor.memory + memoryOverhead
