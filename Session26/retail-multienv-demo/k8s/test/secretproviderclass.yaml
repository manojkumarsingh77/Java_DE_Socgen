# Secrets management for TEST via Azure Key Vault Provider for Secrets Store CSI Driver
# + Azure AD Workload Identity. The application code (AzureKeyVaultSecretsProvider)
# calls the Key Vault SDK directly at runtime using DefaultAzureCredential, which
# resolves the federated identity token from this ServiceAccount's projected token —
# NOT from files mounted by the CSI driver. The SecretProviderClass below is still
# provided as the standard, auditable way to ALSO mirror secrets into native K8s
# Secrets for any sidecar/non-JVM tooling that needs them (e.g. shell-based init
# containers), and to document exactly which secrets this workload consumes.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: retail-platform-spark-sa
  namespace: retail-platform-test
  annotations:
    # Federates this ServiceAccount to an Azure AD Application/Managed Identity.
    # No client secret or certificate is stored anywhere in the cluster.
    azure.workload.identity/client-id: "REPLACE_WITH_TEST_MANAGED_IDENTITY_CLIENT_ID"
  labels:
    azure.workload.identity/use: "true"

---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: retail-platform-kv-secrets
  namespace: retail-platform-test
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "REPLACE_WITH_TEST_MANAGED_IDENTITY_CLIENT_ID"
    keyvaultName: "retail-platform-test-kv"
    tenantId: "REPLACE_WITH_AZURE_TENANT_ID"
    objects: |
      array:
        - |
          objectName: adls-retailplatformtestsa-account-key
          objectType: secret
