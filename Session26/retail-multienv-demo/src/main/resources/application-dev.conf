# =====================================================================================
# application-dev.conf
# Loaded when JVM system property -Dretail.env=dev is set (IntelliJ local run).
# Dev intentionally uses local filesystem I/O and local environment-variable secrets
# so a developer can run the full pipeline with ZERO Azure connectivity.
# =====================================================================================

retail-platform {
  environment.name = "dev"

  spark {
    app-name = "retail-multienv-demo-dev"
    shuffle-partitions = 4
    master = "local[*]"
  }

  data {
    synthetic-record-count = 25000
    output-format = "delta"
    output-path = "/tmp/retail-platform/dev/output/transaction_reconciliation"
    checkpoint-path = "/tmp/retail-platform/dev/checkpoints"
  }

  secrets {
    provider = "local-env"
    key-vault-uri = ""
  }

  reconciliation {
    discrepancy-threshold-cents = 1
  }
}
