# =====================================================================================
# reference.conf — baseline defaults shipped INSIDE the jar.
# Typesafe Config's standard load order (highest precedence first) is:
#   1. system properties (-Dkey=value passed via spark-submit --conf / VM options)
#   2. application-<env>.conf  (loaded explicitly by name, see EnvironmentConfigLoader)
#   3. application.conf        (if present — not used in this project, we load per-env files instead)
#   4. reference.conf          (this file — safe fallback defaults, always packaged in the jar)
# This file must NEVER contain secrets or environment-specific endpoints. It exists purely
# so the application still boots with sane, non-destructive defaults if an env file is missing.
# =====================================================================================

retail-platform {
  environment.name = "unset"

  spark {
    app-name = "retail-multienv-demo"
    shuffle-partitions = 8
    master = "local[*]"
  }

  data {
    synthetic-record-count = 50000
    output-format = "delta"
    output-path = "/tmp/retail-platform/unset/output"
    checkpoint-path = "/tmp/retail-platform/unset/checkpoints"
  }

  secrets {
    # provider: "local-env" for dev workstation runs, "azure-key-vault" for test/prod
    provider = "local-env"
    key-vault-uri = ""
  }

  reconciliation {
    discrepancy-threshold-cents = 1
  }
}
