name: Build and Promote Retail Promotion Model

# Build-once, promote-many: the jar/image built in the "build" job is the
# exact artifact deployed to dev, then test, then prod. Nothing is rebuilt
# between stages - only the Kustomize overlay (and therefore config/secrets
# reference/scale) changes. This is the crux of a real promotion workflow:
# you promote a *verified artifact*, you don't rebuild code differently per
# environment.

on:
  push:
    branches: [main]

env:
  ACR_NAME: acrretailbank
  IMAGE_NAME: retail-platform-promotion-model

jobs:

  build:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.vars.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v4

      - name: Set short SHA as immutable image tag
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build and test
        run: mvn -B -DskipTests=false verify

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR login
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push image
        run: |
          docker build -f docker/Dockerfile \
            -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }} .
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    environment: dev   # no required reviewers - auto-deploy on every merge to main
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Set overlay image tag
        run: |
          cd k8s/overlays/dev
          kustomize edit set image acrretailbank.azurecr.io/retail-platform-promotion-model=${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image-tag }}
      - name: Apply to AKS dev namespace
        run: |
          az aks get-credentials --resource-group rg-retailbank --name aks-retailbank --overwrite-existing
          kubectl apply -k k8s/overlays/dev

  deploy-test:
    needs: [build, deploy-dev]
    runs-on: ubuntu-latest
    environment: test   # optionally gated behind required reviewers in repo Settings > Environments
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Set overlay image tag
        run: |
          cd k8s/overlays/test
          kustomize edit set image acrretailbank.azurecr.io/retail-platform-promotion-model=${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image-tag }}
      - name: Apply to AKS test namespace
        run: |
          az aks get-credentials --resource-group rg-retailbank --name aks-retailbank --overwrite-existing
          kubectl apply -k k8s/overlays/test

  deploy-prod:
    needs: [build, deploy-test]
    runs-on: ubuntu-latest
    # "prod" environment in GitHub Settings > Environments is configured with
    # required reviewers - this job pauses here until a human approves,
    # deploying the SAME image-tag that was already verified in test.
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Set overlay image tag
        run: |
          cd k8s/overlays/prod
          kustomize edit set image acrretailbank.azurecr.io/retail-platform-promotion-model=${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image-tag }}
      - name: Apply to AKS prod namespace
        run: |
          az aks get-credentials --resource-group rg-retailbank --name aks-retailbank --overwrite-existing
          kubectl apply -k k8s/overlays/prod
