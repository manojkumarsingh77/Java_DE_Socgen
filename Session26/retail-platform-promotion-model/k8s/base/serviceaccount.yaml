# Federated with a Microsoft Entra application via Azure AD Workload Identity.
# The federation (azure.workload.identity/client-id annotation) is set per
# environment in the overlay, since dev/test/prod each use a distinct
# Entra application scoped to their own Key Vault and storage account.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark-driver
  labels:
    azure.workload.identity/use: "true"
