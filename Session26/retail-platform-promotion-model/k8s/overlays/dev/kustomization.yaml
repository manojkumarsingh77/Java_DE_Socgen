apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: retail-dev
resources:
  - ../../base
namePrefix: dev-

images:
  - name: acrretailbank.azurecr.io/retail-platform-promotion-model
    newTag: dev-latest

patches:
  - path: patch-sparkapplication.yaml
    target:
      kind: SparkApplication
      name: retail-promotion
  - path: patch-serviceaccount.yaml
    target:
      kind: ServiceAccount
      name: spark-driver
