apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: retail-test
resources:
  - ../../base
namePrefix: test-

images:
  - name: acrretailbank.azurecr.io/retail-platform-promotion-model
    newTag: PLACEHOLDER_GIT_SHA  # set by CI at promotion time, see .github/workflows/promote.yml

patches:
  - path: patch-sparkapplication.yaml
    target:
      kind: SparkApplication
      name: retail-promotion
  - path: patch-serviceaccount.yaml
    target:
      kind: ServiceAccount
      name: spark-driver
