# =============================================================================
# TEST overlay - loaded when -Denv=test. Runs on AKS against the TEST
# storage account and TEST Key Vault. Synthetic data volume is larger than
# dev to exercise real partitioning/shuffle behaviour.
# =============================================================================

spark {
  # No "master" key here on purpose - spark-submit --master k8s://... controls
  # this in cluster mode. Setting it here would silently override the CLI flag.
  shuffle.partitions = 64
}

secrets {
  provider = "keyvault"
  key.vault.url = "https://kv-retailbank-test.vault.azure.net/"
  downstream.api.key.secret.name = "promotion-downstream-api-key"
}

storage {
  format = "delta"
  input.path = "abfss://raw@retailbanktestadls.dfs.core.windows.net/pos-events/"
  output.path = "abfss://curated@retailbanktestadls.dfs.core.windows.net/promotion-scores/"
}

environment.tag = "test"
