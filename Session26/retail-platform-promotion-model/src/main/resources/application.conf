# =============================================================================
# Base configuration. Never edit environment-specific values here.
# Environment overlay (application-dev.conf / application-test.conf /
# application-prod.conf) is selected at runtime by ConfigLoader based on the
# "env" system property (-Denv=dev|test|prod, default = dev) and merged on
# top of this file with Typesafe Config's withFallback semantics.
# =============================================================================

app {
  name = "retail-platform-promotion-model"
}

spark {
  # master is intentionally NOT set here for test/prod - spark-submit --master
  # k8s://... always wins in cluster mode. It IS set in application-dev.conf
  # so the app is runnable straight from IntelliJ with no spark-submit at all.
  shuffle.partitions = 8
}

promotion {
  # Business rule thresholds - identical across environments on purpose.
  # Only infrastructure concerns (storage, secrets, scale) change per env.
  high.value.threshold = 5000.0
  loyalty.bonus.tiers = ["GOLD", "PLATINUM"]
  risk.score.max.eligible = 70
}

secrets {
  # provider = local | keyvault
  provider = "local"
  key.vault.url = ""
  downstream.api.key.secret.name = "promotion-downstream-api-key"
}

storage {
  format = "parquet"
  input.path = "local-input"
  output.path = "local-output"
}
