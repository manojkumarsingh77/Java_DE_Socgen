# =============================================================================
# DEV overlay - loaded when -Denv=dev (or no -Denv flag at all).
# Goal: zero external dependencies. Runs entirely on the laptop, synthetic
# data only, secrets read from local environment variables.
# =============================================================================

spark {
  master = "local[*]"
  shuffle.partitions = 4
}

secrets {
  provider = "local"
  # LocalEnvSecretsProvider looks up RETAILBANK_<SECRET_NAME_UPPER_SNAKE> env vars.
  downstream.api.key.secret.name = "promotion-downstream-api-key"
}

storage {
  format = "parquet"
  # Relative paths for dev - ConfigLoader resolves these against java.io.tmpdir
  # at runtime so the demo never writes outside the OS temp directory.
  input.path = "retailbank/dev/input"
  output.path = "retailbank/dev/output"
}

environment.tag = "dev"
