# =============================================================================
# PROD overlay - loaded when -Denv=prod. Runs on AKS against the PROD
# storage account and PROD Key Vault, fed by workload-identity, never by a
# service principal secret checked into any file.
# =============================================================================

spark {
  shuffle.partitions = 400
}

secrets {
  provider = "keyvault"
  key.vault.url = "https://kv-retailbank-prod.vault.azure.net/"
  downstream.api.key.secret.name = "promotion-downstream-api-key"
}

storage {
  format = "delta"
  input.path = "abfss://raw@retailbankprodadls.dfs.core.windows.net/pos-events/"
  output.path = "abfss://curated@retailbankprodadls.dfs.core.windows.net/promotion-scores/"
}

environment.tag = "prod"
