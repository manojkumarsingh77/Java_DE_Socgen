apiVersion: v1
kind: Pod
spec:
  tolerations:
    - key: "workload"
      operator: "Equal"
      value: "data-engineering"
      effect: "NoSchedule"
  containers:
    - name: spark-kubernetes-driver
      resources:
        requests:
          memory: "2Gi"
          cpu: "1"
        limits:
          memory: "2560Mi"   # headroom above spark.driver.memory for JVM overhead
          cpu: "2"
